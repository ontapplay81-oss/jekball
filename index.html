
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JekBall Casino</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Goldman:wght@400;700&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0a0a0a;
      color: #ffffff;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }
    .font-goldman {
      font-family: 'Goldman', cursive;
    }
    .gold-gradient {
      background: linear-gradient(135deg, #d4af37 0%, #f9f295 50%, #d4af37 100%);
    }
    .gold-text {
      background: linear-gradient(135deg, #d4af37 0%, #f9f295 50%, #d4af37 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    @keyframes pulse-gold {
      0%, 100% { box-shadow: 0 0 10px rgba(212, 175, 55, 0.4); }
      50% { box-shadow: 0 0 30px rgba(212, 175, 55, 0.8); }
    }
    .animate-pulse-gold {
      animation: pulse-gold 2s infinite;
    }
    @keyframes spin-slow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .animate-spin-slow {
      animation: spin-slow 8s linear infinite;
    }
  </style>
<script type="importmap">

  }
}
</script>
</head>
<body>
  <div id="root"></div>
</body>
</html>
